[project]
name = "lead-search"
version = "0.1.0"
description = "CLI pipeline that discovers, verifies, and researches organizations of any type in a target area, and finds outreach contacts. No UI."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "pydantic>=2.7",
]

[project.scripts]
lead-search = "lead_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lead_search"]
